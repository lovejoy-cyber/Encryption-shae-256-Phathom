services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: phantomvault
      POSTGRES_PASSWORD: phantomvault
      POSTGRES_DB: phantomvault
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phantomvault"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: phantomvault
      MINIO_ROOT_PASSWORD: phantomvault-dev-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://phantomvault:phantomvault@postgres:5432/phantomvault
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      PORT: 3000
      ML_SERVICE_URL: http://ml-service:8001
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: phantomvault
      S3_SECRET_KEY: phantomvault-dev-only
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  ml-service:
    build:
      context: ./ml-service
    environment:
      DATABASE_URL: postgres://phantomvault:phantomvault@postgres:5432/phantomvault
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - api

volumes:
  pg_data:
  minio_data:
